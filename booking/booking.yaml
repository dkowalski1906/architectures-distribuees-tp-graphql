openapi: 3.0.3
info:
  title: Booking GraphQL Microservice
  version: 1.0.0
  description: API GraphQL pour la gestion des réservations (lecture, ajout, suppression) avec références aux microservices Movie et User.

servers:
  - url: http://localhost:3203
    description: Service GraphQL Booking

paths:
  /graphql:
    post:
      summary: Exécuter une requête GraphQL sur les réservations
      requestBody:
        required: true
        content:
          application/json:
            examples:
              queryAll:
                $ref: '#/components/examples/queryAll'
              queryByUser:
                $ref: '#/components/examples/queryByUser'
              mutationAdd:
                $ref: '#/components/examples/mutationAdd'
              mutationRemoveMovie:
                $ref: '#/components/examples/mutationRemoveMovie'
              mutationRemoveUser:
                $ref: '#/components/examples/mutationRemoveUser'
      responses:
        "200":
          description: Réponse GraphQL réussie
          content:
            application/json:
              examples:
                queryAllResponse:
                  summary: Exemple de réponse contenant toutes les réservations
                  value:
                    data:
                      bookings_json:
                        - userid:
                            id: "user-001"
                            name: "Alice"
                            last_active: 1697301123
                            is_admin: false
                          dates:
                            - date: "2025-10-21"
                              movies:
                                - id: "m1"
                                  title: "Inception"
                                  director: "Christopher Nolan"
                                  rating: 8.8
                                - id: "m2"
                                  title: "Matrix"
                                  director: "Wachowski"
                                  rating: 8.7
                        - userid:
                            id: "user-002"
                            name: "Bob"
                            last_active: 1697250000
                            is_admin: true
                          dates:
                            - date: "2025-10-22"
                              movies:
                                - id: "m3"
                                  title: "The Martian"
                                  director: "Ridley Scott"
                                  rating: 8.0
                queryByUserResponse:
                  summary: Réponse d’une réservation pour un utilisateur donné
                  value:
                    data:
                      booking_with_user_id:
                        userid:
                          id: "user-001"
                          name: "Alice"
                          last_active: 1697301123
                          is_admin: false
                        dates:
                          - date: "2025-10-21"
                            movies:
                              - id: "m1"
                                title: "Inception"
                                director: "Christopher Nolan"
                                rating: 8.8

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        last_active:
          type: integer
        is_admin:
          type: boolean

    Movie:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        director:
          type: string
        rating:
          type: number
          format: float

    Date:
      type: object
      properties:
        date:
          type: string
        movies:
          type: array
          items:
            $ref: '#/components/schemas/Movie'

    Booking:
      type: object
      properties:
        userid:
          $ref: '#/components/schemas/User'
        dates:
          type: array
          items:
            $ref: '#/components/schemas/Date'

  examples:
    queryAll:
      summary: Obtenir toutes les réservations
      value: |
        {
          "query": "query { bookings_json { userid { id name last_active is_admin } dates { date movies { id title director rating } } } }"
        }

    queryByUser:
      summary: Obtenir une réservation par identifiant utilisateur
      value: |
        {
          "query": "query { booking_with_user_id(id: \"chris_rivers\") { userid { id name last_active is_admin } dates { date movies { id title director rating } } } }"
        }

    mutationAdd:
      summary: Ajouter une réservation
      value: |
        {
          "query": "mutation { add_booking(userid: \"chris_rivers\", date: \"20151201\", movieid: \"a8034f44-aee4-44cf-b32c-74cf452aaaaz\") { userid { id name } dates { date movies { id title } } } }"
        }

    mutationRemoveMovie:
      summary: Supprimer un film d’une réservation donnée
      value: |
        {
          "query": "mutation { remove_booking_with_movie_date_user(userid: \"dwight_schrute\", date: \"20151201\", movieid: \"7daf7208-be4d-4944-a3ae-c1c2f516f3e6\") { userid { id name } dates { date movies { id title } } } }"
        }


    mutationRemoveUser:
      summary: Supprimer toutes les réservations d’un utilisateur
      value: |
        {
          "query": "mutation { remove_bookings_with_user_id(userid: \"chris_rivers\") }"
        }
