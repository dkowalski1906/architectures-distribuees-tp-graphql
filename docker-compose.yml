services:
  # ============================================================================
  # BASE DE DONNÉES MONGODB
  # ============================================================================
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo-data:/data/db
      - ./init-mongo:/docker-entrypoint-initdb.d:ro
    networks:
      - movie-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # SERVICE USER
  # ============================================================================
  user:
    build:
      context: .
      dockerfile: user/Dockerfile
    container_name: user
    restart: unless-stopped
    environment:
      - USE_DOCKER=true
      - USE_MONGODB=${USE_MONGODB}
      - MONGO_HOST=mongodb
      - MONGO_PORT=${MONGO_PORT}
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - USER_PORT=${USER_PORT}
      - CACHE_TTL=${CACHE_TTL}
    ports:
      - "${USER_PORT}:${USER_PORT}"
    networks:
      - movie-net
    depends_on:
      mongodb:
        condition: service_healthy

  # ============================================================================
  # SERVICE MOVIE
  # ============================================================================
  movie:
    build:
      context: .
      dockerfile: movie/Dockerfile
    container_name: movie
    restart: unless-stopped
    environment:
      - USE_DOCKER=true
      - USE_MONGODB=${USE_MONGODB}
      - MONGO_HOST=mongodb
      - MONGO_PORT=${MONGO_PORT}
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MOVIE_PORT=${MOVIE_PORT}
      - USER_PORT=${USER_PORT}
      - CACHE_TTL=${CACHE_TTL}
    ports:
      - "${MOVIE_PORT}:${MOVIE_PORT}"
    networks:
      - movie-net
    depends_on:
      mongodb:
        condition: service_healthy
      user:
        condition: service_started

  # ============================================================================
  # SERVICE BOOKING
  # ============================================================================
  booking:
    build:
      context: .
      dockerfile: booking/Dockerfile
    container_name: booking
    restart: unless-stopped
    environment:
      - USE_DOCKER=true
      - USE_MONGODB=${USE_MONGODB}
      - MONGO_HOST=mongodb
      - MONGO_PORT=${MONGO_PORT}
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - BOOKING_PORT=${BOOKING_PORT}
      - USER_PORT=${USER_PORT}
      - MOVIE_PORT=${MOVIE_PORT}
      - CACHE_TTL=${CACHE_TTL}
    ports:
      - "${BOOKING_PORT}:${BOOKING_PORT}"
    networks:
      - movie-net
    depends_on:
      mongodb:
        condition: service_healthy
      user:
        condition: service_started

  # ============================================================================
  # SERVICE SCHEDULE
  # ============================================================================
  schedule:
    build:
      context: .
      dockerfile: schedule/Dockerfile
    container_name: schedule
    restart: unless-stopped
    environment:
      - USE_DOCKER=true
      - USE_MONGODB=${USE_MONGODB}
      - MONGO_HOST=mongodb
      - MONGO_PORT=${MONGO_PORT}
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - SCHEDULE_PORT=${SCHEDULE_PORT}
      - USER_PORT=${USER_PORT}
      - MOVIE_PORT=${MOVIE_PORT}
      - CACHE_TTL=${CACHE_TTL}
    ports:
      - "${SCHEDULE_PORT}:${SCHEDULE_PORT}"
    networks:
      - movie-net
    depends_on:
      mongodb:
        condition: service_healthy
      user:
        condition: service_started

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  mongo-data:
    driver: local

# ============================================================================
# RÉSEAUX
# ============================================================================
networks:
  movie-net:
    driver: bridge